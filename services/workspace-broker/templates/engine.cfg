name: "vibe-poc-engine"
mode: ONCE
hostname: "vibe-engine"
cwd: "/engine"
time_limit: 0
rlimit_as_type: INF
rlimit_cpu_type: INF
rlimit_fsize: 32
rlimit_nofile: 128
rlimit_nproc_type: SOFT
rlimit_core: 0
keep_env: false
envar: "PATH=/usr/bin:/bin"
envar: "HOME=/engine"
envar: "DSH_HOME=/engine"
envar: "NODE_OPTIONS=--max-old-space-size=320"
envar: "NARB_DISABLE_NATIVE_CACHE=1"
envar: "LANG=C.UTF-8"
envar: "TMPDIR=/tmp"
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true
uidmap { inside_id: "1000" outside_id: "23000" count: 1 }
gidmap { inside_id: "1000" outside_id: "23000" count: 1 }
mount { src: "/opt/vibe-os/rootfs" dst: "/" is_bind: true rw: false }

mount { dst: "/proc" fstype: "proc" rw: false }
mount { dst: "/tmp" fstype: "tmpfs" nosuid: true nodev: true noexec: true options: "size=16m,mode=1777" rw: true }
mount { dst: "/home/pupil" fstype: "tmpfs" nosuid: true nodev: true noexec: true options: "size=8m,mode=1777" rw: true }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true }
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true rw: false }
mount { src: "/dev/random" dst: "/dev/random" is_bind: true rw: false }
mount { src: "/opt/vibe-os/releases/harness-5badb150" dst: "/opt/vibe-os/build/deepseek-harness" is_bind: true rw: false is_dir: true }
mount { src: "/opt/vibe-os/poc-profile" dst: "/opt/vibe-os/poc-profile" is_bind: true rw: false is_dir: true }
mount { src: "/srv/vibe-os/data/poc-engine-1" dst: "/engine" is_bind: true rw: true is_dir: true }
mount { src: "/run/vibe-os-poc" dst: "/bridge" is_bind: true rw: false is_dir: true }
mount { src: "/var/lib/vibe-os/poc-engine/capability" dst: "/capability" is_bind: true rw: false is_dir: false }
seccomp_policy_file: "/etc/vibe-os/engine.policy"
mount { src: "/srv/vibe-os/data/poc-engine-1/profiles/school-poc/package.json" dst: "/engine/profiles/school-poc/package.json" is_bind: true rw: false is_dir: false }
mount { src: "/srv/vibe-os/data/poc-engine-1/profiles/school-poc/cordis.patch.yml" dst: "/engine/profiles/school-poc/cordis.patch.yml" is_bind: true rw: false is_dir: false }

mount { src: "/run/vibe-os-model" dst: "/model" is_bind: true rw: false is_dir: true }
mount { src: "/var/lib/vibe-os/poc-engine/model-capability" dst: "/model-capability" is_bind: true rw: false is_dir: false }
mount { src: "/srv/vibe-os/data/poc-engine-1/profiles/school-live/package.json" dst: "/engine/profiles/school-live/package.json" is_bind: true rw: false is_dir: false }
mount { src: "/srv/vibe-os/data/poc-engine-1/profiles/school-live/cordis.patch.yml" dst: "/engine/profiles/school-live/cordis.patch.yml" is_bind: true rw: false is_dir: false }
