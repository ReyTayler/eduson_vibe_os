name: "vibe-poc-tool-1"
mode: ONCE
hostname: "vibe-tool"
cwd: "/workspace"
time_limit: 0
rlimit_as_type: INF
rlimit_cpu_type: INF
rlimit_fsize: 32
rlimit_nofile: 128
rlimit_nproc_type: SOFT
rlimit_core: 0
keep_env: false
envar: "PATH=/usr/bin:/bin"
envar: "HOME=/home/pupil"
envar: "LANG=C.UTF-8"
envar: "TMPDIR=/tmp"
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true
uidmap { inside_id: "1000" outside_id: "23001" count: 1 }
gidmap { inside_id: "1000" outside_id: "23001" count: 1 }
mount { src: "/opt/vibe-os/rootfs" dst: "/" is_bind: true rw: false }
mount { src: "/srv/vibe-os/data/poc-project-1" dst: "/workspace" is_bind: true rw: true }
mount { dst: "/proc" fstype: "proc" rw: false }
mount { dst: "/tmp" fstype: "tmpfs" nosuid: true nodev: true noexec: true options: "size=16m,mode=1777" rw: true }
mount { dst: "/home/pupil" fstype: "tmpfs" nosuid: true nodev: true noexec: true options: "size=8m,mode=1777" rw: true }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true }
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true rw: false }
mount { src: "/dev/random" dst: "/dev/random" is_bind: true rw: false }
seccomp_policy_file: "/etc/vibe-os/school.policy"
