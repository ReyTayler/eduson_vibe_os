user www-data;
worker_processes 1;
pid /run/vibe-os-test-web/nginx.pid;
error_log stderr warn;
daemon off;
events {
    worker_connections 256;
}
http {
    access_log off;
    default_type text/plain;
    server_tokens off;
    keepalive_timeout 10s;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 5s;
    client_max_body_size 1k;
    client_body_temp_path /run/vibe-os-test-web/client-body;
    proxy_temp_path /run/vibe-os-test-web/proxy-temp;
    limit_req_zone $binary_remote_addr zone=fixture_requests:1m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=fixture_connections:1m;
    server {
        listen 0.0.0.0:80 default_server;
        server_name 80.249.145.94;
        limit_req zone=fixture_requests burst=20 nodelay;
        limit_req_status 429;
        limit_conn fixture_connections 8;
        limit_conn_status 429;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_method GET;
        location = / {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8810;
        }
        location ~ ^/projects/[1-4]/?$ {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8810;
        }
        location / {
            return 404;
        }
    }
}
