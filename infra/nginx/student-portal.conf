user www-data;
worker_processes 1;
pid /run/vibe-os-portal-web/nginx.pid;
error_log stderr warn;
daemon off;
events { worker_connections 1024; }
http {
 access_log off;
 server_tokens off;
 default_type text/plain;
 keepalive_timeout 15s;
 client_header_timeout 5s;
 client_body_timeout 10s;
 send_timeout 20s;
 client_max_body_size 300k;
 client_body_temp_path /run/vibe-os-portal-web/client-body;
 proxy_temp_path /run/vibe-os-portal-web/proxy-temp;
 gzip on;
 gzip_min_length 1024;
 gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
 limit_req_zone $binary_remote_addr zone=portal_requests:2m rate=25r/s;
 limit_conn_zone $binary_remote_addr zone=portal_connections:2m;
 ssl_certificate /etc/letsencrypt/live/80.249.145.94/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/80.249.145.94/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_cache shared:portal_tls:4m;
 ssl_session_timeout 1h;
 ssl_session_tickets off;
 server {
  listen 0.0.0.0:80 default_server;
  server_name 80.249.145.94;
  location ^~ /.well-known/acme-challenge/ {root /var/lib/vibe-os/acme;limit_except GET {deny all;}}
  location / {return 308 https://80.249.145.94$request_uri;}
 }
 server {
  listen 0.0.0.0:443 ssl http2 default_server;
  server_name 80.249.145.94;
  limit_req zone=portal_requests burst=60 nodelay;
  limit_req_status 429;
  limit_conn portal_connections 24;
  limit_conn_status 429;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Strict-Transport-Security "max-age=2592000" always;
  location ^~ /published/ {return 404;}
  location = /health {return 404;}
  location / {
   proxy_pass http://127.0.0.1:8820;
   proxy_http_version 1.1;
   proxy_set_header Host 80.249.145.94;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Proto https;
   proxy_set_header Connection "";
   proxy_buffering off;
   proxy_request_buffering off;
   proxy_connect_timeout 3s;
   proxy_read_timeout 260s;
   proxy_send_timeout 20s;
  }
 }
 server {
  listen 0.0.0.0:8443 ssl http2 default_server;
  server_name 80.249.145.94;
  limit_req zone=portal_requests burst=60 nodelay;
  limit_req_status 429;
  limit_conn portal_connections 24;
  limit_conn_status 429;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location ^~ /published/ {
   limit_except GET {deny all;}
   proxy_pass http://127.0.0.1:8820;
   proxy_http_version 1.1;
   proxy_set_header Host 80.249.145.94;
   proxy_set_header Cookie "";
   proxy_set_header Authorization "";
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header Connection "";
   proxy_buffering off;
   proxy_connect_timeout 3s;
   proxy_read_timeout 15s;
  }
  location / {return 404;}
 }
}
